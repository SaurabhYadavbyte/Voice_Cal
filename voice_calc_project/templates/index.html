<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Calculator · VoiceCalc</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='calculator.css') }}">
  <script src="{{ url_for('static', filename='calculator.js') }}" defer></script>
</head>
<body class="calculator-page">
  <main class="calculator-shell" data-calculate-url="{{ url_for('calculate') }}">
    <header class="calc-top">
      <a class="history-icon" href="{{ url_for('history') }}" aria-label="Calculation history" title="History">◴</a>
      <span class="brand">VOICE<span>CALC</span></span>
      <details class="menu">
        <summary aria-label="Open menu" title="Menu">⋮</summary>
        <div class="menu-panel">
          <a href="{{ url_for('history') }}">◴ &nbsp; History</a>
          <a href="{{ url_for('history') }}#clear-history">⌫ &nbsp; Clear history</a>
          <button type="button" id="theme-switch">◐ &nbsp; Choose theme</button>
          <a href="{{ url_for('privacy') }}">◇ &nbsp; Privacy policy</a>
          <a href="https://github.com/SaurabhYadavbyte/Voice_Cal/issues" rel="noopener noreferrer" target="_blank">✉ &nbsp; Send feedback</a>
          <a href="{{ url_for('help_page') }}">? &nbsp; Help</a>
          <form action="{{ url_for('logout') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit">↪ &nbsp; Sign out</button>
          </form>
        </div>
      </details>
    </header>

    <section class="calc-display" aria-label="Calculation">
      <p class="display-label">Current expression</p>
      <div id="expression" class="expression" aria-live="polite">0</div>
      <div id="result" class="result" aria-live="polite"></div>
    </section>
    <div class="display-footer"><span id="mode-indicator">DEGREES</span><span id="status" role="status" aria-live="polite"></span></div>
    <button id="voice-btn" class="voice-btn" type="button" aria-label="Start voice input"><span aria-hidden="true">🎙</span> Speak an expression</button>

    <section class="keypad" aria-label="Calculator keypad">
      <button class="key science" data-value="sqrt(">√</button>
      <button class="key science" data-value="pi">π</button>
      <button class="key science" data-value="^">^</button>
      <button class="key science" data-action="factorial">!</button>
      <button class="key science" data-action="angle" id="angle-btn">Deg</button>
      <button class="key science" data-value="sin(" data-inverse="asin(">sin</button>
      <button class="key science" data-value="cos(" data-inverse="acos(">cos</button>
      <button class="key science" data-value="tan(" data-inverse="atan(">tan</button>
      <button class="key science" data-action="inverse" id="inverse-btn">Inv</button>
      <button class="key science" data-value="e">e</button>
      <button class="key science" data-value="ln(">ln</button>
      <button class="key science" data-value="log(">log</button>
      <button class="key clear" data-action="clear">AC</button>
      <button class="key science" data-action="parenthesis">( )</button>
      <button class="key science" data-value="%">%</button>
      <button class="key operator" data-value="/">÷</button>
      <button class="key number" data-value="7">7</button>
      <button class="key number" data-value="8">8</button>
      <button class="key number" data-value="9">9</button>
      <button class="key operator" data-value="*">×</button>
      <button class="key number" data-value="4">4</button>
      <button class="key number" data-value="5">5</button>
      <button class="key number" data-value="6">6</button>
      <button class="key operator" data-value="-">−</button>
      <button class="key number" data-value="1">1</button>
      <button class="key number" data-value="2">2</button>
      <button class="key number" data-value="3">3</button>
      <button class="key operator" data-value="+">+</button>
      <button class="key number" data-value="0">0</button>
      <button class="key number" data-value=".">.</button>
      <button class="key number" data-action="backspace" aria-label="Delete last character">⌫</button>
      <button class="key equals" data-action="equals">=</button>
    </section>
  </main>
</body>
</html>
