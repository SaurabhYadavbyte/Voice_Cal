<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Secure Voice Calculator</title>
    <style>
        /* iOS-style Typography and Background */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }

        .calculator-container {
            background: #1c1c1c;
            padding: 30px 20px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 320px;
            border: 1px solid #333;
        }

        /* Sleek Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 10px;
        }
        .navbar a {
            text-decoration: none;
            color: #a5a5a5;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .navbar a:hover {
            color: #ffffff;
        }
        .navbar a.logout {
            color: #d91438;
        }
        .logout-form { margin: 0; }
        .logout-form button {
            border: 0;
            background: none;
            color: #f87171;
            font: inherit;
            cursor: pointer;
        }
        .status {
            min-height: 1.5em;
            margin: 12px 8px 0;
            color: #a5a5a5;
            font-size: 0.85rem;
            text-align: center;
        }

        /* Large, Thin Display */
        #display {
            width: 100%;
            height: 90px;
            font-size: 4.5rem;
            text-align: right;
            margin-bottom: 20px;
            border: none;
            padding: 0 10px;
            box-sizing: border-box;
            background: transparent;
            color: #ffffff;
            font-weight: 300;
            outline: none;
        }

        /* Perfectly Spaced Grid */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        /* Circular Buttons */
        .calc-btn {
            border-radius: 50%;
            aspect-ratio: 1 / 1;
            font-size: 2rem;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.15s ease-in-out;
            font-family: inherit;
        }
        .calc-btn:active {
            filter: brightness(1.5);
        }

        /* Color Scheme mapping to your image */
        .btn-num {
            background: #333333;
            color: #ffffff;
        }
        .btn-action {
            background: #a5a5a5;
            color: #000000;
            font-size: 1.6rem; /* Slightly smaller text for action words */
        }
        .btn-op {
            background: #d91438;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 400;
        }

        /* The Zero Button (Spans 2 columns) */
        .btn-zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 50px;
            justify-content: flex-start;
            padding-left: 30px;
        }

        /* Integrated Voice Button */
        .btn-voice {
            grid-column: span 4;
            aspect-ratio: auto;
            border-radius: 20px;
            padding: 18px 0;
            background: #2c2c2c;
            color: #4da6ff;
            font-size: 1.2rem;
            font-weight: 500;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-voice.recording {
            color: #d91438;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        @media (max-width: 380px) {
            .calculator-container { width: 100%; padding: 24px 16px; }
            .buttons-grid { gap: 8px; }
            .calc-btn { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <div class="navbar">
        <a href="{{ url_for('history') }}">History</a>
        <form action="{{ url_for('logout') }}" method="POST" class="logout-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit">Logout</button>
        </form>
    </div>

    <input type="text" id="display" readonly placeholder="0" aria-label="Calculator expression and result">

    <div class="buttons-grid">
        <!-- Row 1: Action (Light Grey) & Operator (Red) -->
        <button class="calc-btn btn-action" onclick="clearDisplay()">C</button>
        <button class="calc-btn btn-action" onclick="deleteLastChar()">DEL</button>
        <button class="calc-btn btn-action" onclick="appendToDisplay('%')">%</button>
        <button class="calc-btn btn-op" onclick="appendToDisplay('/')">÷</button>

        <!-- Row 2: Numbers (Dark Grey) & Operator (Red) -->
        <button class="calc-btn btn-num" onclick="appendToDisplay('7')">7</button>
        <button class="calc-btn btn-num" onclick="appendToDisplay('8')">8</button>
        <button class="calc-btn btn-num" onclick="appendToDisplay('9')">9</button>
        <button class="calc-btn btn-op" onclick="appendToDisplay('*')">×</button>

        <!-- Row 3 -->
        <button class="calc-btn btn-num" onclick="appendToDisplay('4')">4</button>
        <button class="calc-btn btn-num" onclick="appendToDisplay('5')">5</button>
        <button class="calc-btn btn-num" onclick="appendToDisplay('6')">6</button>
        <button class="calc-btn btn-op" onclick="appendToDisplay('-')">-</button>

        <!-- Row 4 -->
        <button class="calc-btn btn-num" onclick="appendToDisplay('1')">1</button>
        <button class="calc-btn btn-num" onclick="appendToDisplay('2')">2</button>
        <button class="calc-btn btn-num" onclick="appendToDisplay('3')">3</button>
        <button class="calc-btn btn-op" onclick="appendToDisplay('+')">+</button>

        <!-- Row 5: Zero (Pill shape), Decimal, Equals -->
        <button class="calc-btn btn-num btn-zero" onclick="appendToDisplay('0')">0</button>
        <button class="calc-btn btn-num" onclick="appendToDisplay('.')">.</button>
        <button class="calc-btn btn-op" onclick="calculateResult()">=</button>

        <!-- Row 6: Voice Button -->
        <button class="calc-btn btn-voice" id="voice-btn" onclick="startVoiceRecognition()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
            Tap to Speak
        </button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
</div>

<script>
    const display = document.getElementById('display');
    const status = document.getElementById('status');
    const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
    let currentExpression = '';

    // Function to visually replace * and / with professional symbols on screen
    function updateDisplay() {
        if (currentExpression === '') {
            display.value = '';
            return;
        }
        display.value = currentExpression
            .replace(/\*/g, '×')
            .replace(/\//g, '÷');
    }

    function appendToDisplay(value) {
        currentExpression += value;
        updateDisplay();
        status.textContent = '';
    }

    function clearDisplay() {
        currentExpression = '';
        updateDisplay();
        display.placeholder = '0';
        status.textContent = 'Cleared';
    }

    function deleteLastChar() {
        currentExpression = currentExpression.slice(0, -1);
        updateDisplay();
    }

    function calculateResult() {
        if (!currentExpression) return;

        // The percent key means "divide by 100".
        const backendExpr = currentExpression.replace(/%/g, '/100');
        status.textContent = 'Calculating…';
        fetch('{{ url_for("calculate") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': csrfToken,
            },
            body: JSON.stringify({ expression: backendExpr })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                currentExpression = data.result;
                updateDisplay();
                status.textContent = 'Saved to history';
            } else {
                display.value = 'Error';
                currentExpression = '';
                status.textContent = data.error || 'Invalid expression';
            }
        })
        .catch(() => {
            display.value = 'Error';
            currentExpression = '';
            status.textContent = 'Connection error. Please try again.';
        });
    }

    // Voice Recognition Logic
    function startVoiceRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            status.textContent = "Voice input is unavailable in this browser. Use the keypad.";
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const voiceBtn = document.getElementById('voice-btn');
        const originalHtml = voiceBtn.innerHTML;
        voiceBtn.classList.add('recording');
        voiceBtn.innerHTML = 'Listening...';

        recognition.start();

        recognition.onresult = function(event) {
            let speechResult = event.results[0][0].transcript.toLowerCase();

            const numberWords = {
                zero: '0', one: '1', two: '2', three: '3', four: '4',
                five: '5', six: '6', seven: '7', eight: '8', nine: '9',
                ten: '10', eleven: '11', twelve: '12'
            };
            speechResult = speechResult.replace(/\b(multiplied by|divided by|plus|minus|times|over|percent|point|equals|x|zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/g,
                word => ({
                    'multiplied by': '*', 'divided by': '/', plus: '+', minus: '-',
                    times: '*', x: '*', over: '/', percent: '%', point: '.', equals: '',
                    ...numberWords
                })[word]);

            // Strip out non-math words before setting currentExpression
            currentExpression = speechResult.replace(/[^0-9+\-*/().%\s]/g, '');
            updateDisplay();
            if (currentExpression.trim()) {
                calculateResult();
            } else {
                status.textContent = 'No calculation heard. Please try again.';
            }
        };

        recognition.onspeechend = function() {
            recognition.stop();
        };

        recognition.onend = function() {
            voiceBtn.classList.remove('recording');
            voiceBtn.innerHTML = originalHtml;
        };

        recognition.onerror = function(event) {
            voiceBtn.classList.remove('recording');
            voiceBtn.innerHTML = originalHtml;
            if(event.error !== 'no-speech') {
                status.textContent = 'Voice recognition error: ' + event.error;
            }
        };
    }
</script>
</body>
</html>
